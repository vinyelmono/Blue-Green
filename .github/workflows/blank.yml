# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - "main"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  ci:
    name: Integración continua
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxis de python
        run: python -m py_compile app.py

      - name: Ejecutar prueba básica
        run: |
          python -c "from app import crear_Servidor; print('Código Valido')"

  cd:
    name: Despliegue Blue Green
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Iniciar version Blue
        run: |
          python app.py --version blue --puerto 8800 > blue.log 2>&1 &
          echo $! > green.pid

      - name: Probar version Green en puerto 8800
        run: |
          respuesta=$(curl --fail --silent http://localhost:8800)
          echo "$respuesta"